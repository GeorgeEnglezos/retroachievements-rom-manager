org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project is on E: but the Pub cache (plugin sources) is on C:. Kotlin's
# incremental compiler can't compute source paths relative to the project across
# different drive roots, which crashes the build. Disabling incremental Kotlin
# compilation sidesteps it. (Only affects Android builds.)
kotlin.incremental=false
